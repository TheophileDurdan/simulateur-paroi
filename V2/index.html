<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulateur paroi</title>
    <meta
      name="description"
      content="Simulateur interactif de transfert thermique à travers une paroi : conduction, convection, rayonnement, canicule, presets bâtiment."
    />
    <meta property="og:title" content="Simulateur paroi" />
    <meta
      property="og:description"
      content="Jouez avec les couches, l'orientation, la ventilation et les profils climat en temps réel."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="banner"></header>
      <div id="workspace">
        <aside id="left-column">
          <section id="zone-site" class="zone zone-site">
            <div class="zone-site-row">
              <div id="facade-host"></div>
              <div class="solar-chart-panel" title="Rayonnement solaire reçu par la paroi — profil horaire éditable à la souris">
                <canvas id="solar-chart-canvas"></canvas>
              </div>
            </div>
          </section>
          <section id="zone-layers" class="zone zone-layers"></section>
          <section id="zone-temp" class="zone zone-temp">
            <div id="temp-zone-header"></div>
            <div class="temp-chart-panel" title="Profil horaire de température extérieure — éditable à la souris en mode T ext. auto">
              <canvas id="temp-chart-canvas"></canvas>
            </div>
            <div id="temp-legend"></div>
          </section>
        </aside>
        <main id="right-column">
          <canvas
            id="wall-canvas"
            title="Coupe de la paroi : barres colorées = températures. Thermomètres air ext. (gauche) et int. (droite)."
          ></canvas>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
